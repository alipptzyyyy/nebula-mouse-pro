
name: Prepare NEBULA Flutter ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate complete Flutter project
        run: |
          flutter create --platforms=android --project-name nebula_mouse_pro nebula_mouse_pro
          cp lib/main.dart nebula_mouse_pro/lib/main.dart

      - name: Upload complete source project
        uses: actions/upload-artifact@v4
        with:
          name: NEBULA-MOUSE-PRO-SOURCE
          path: nebula_mouse_pro/**
          if-no-files-found: error
          retention-days: 7
